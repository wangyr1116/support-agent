<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Agent · 技术支持助手</title>
  <style>
    :root { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #18312e; background: #f3f6f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1060px; margin: auto; padding: 44px 24px; }
    .eyebrow { color: #337466; letter-spacing: 2px; font-size: 13px; }
    h1 { font-size: clamp(28px, 5vw, 42px); margin: 12px 0; }
    h2 { font-size: 19px; margin-top: 0; }
    .muted { color: #62736d; line-height: 1.7; }
    .card { background: white; border: 1px solid #dce5df; border-radius: 16px; padding: 24px; margin-top: 22px; }
    label { display: block; font-weight: 600; margin-bottom: 12px; }
    textarea { width: 100%; min-height: 115px; resize: vertical; border: 1px solid #b9cec3; border-radius: 10px; padding: 14px; font: inherit; }
    textarea:focus, button:focus-visible, a:focus-visible { outline: 3px solid #81bca9; outline-offset: 3px; }
    .examples { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 20px; }
    button { cursor: pointer; font: inherit; border: 0; border-radius: 8px; padding: 10px 15px; }
    .example { background: #edf4f0; color: #315c4e; font-size: 13px; }
    #submit { background: #176b53; color: white; padding: 12px 25px; }
    button:disabled { opacity: .55; cursor: wait; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
    a { color: #176b53; }
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .answer, pre { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; }
    pre { background: #f4f7f5; padding: 12px; border-radius: 8px; font-size: 13px; }
    details { border-top: 1px solid #e2e9e5; padding: 14px 0; }
    summary { cursor: pointer; line-height: 1.7; }
    .source { padding: 12px 0; border-top: 1px solid #e2e9e5; }
    .error { color: #ad3535; }
    [hidden] { display: none !important; }
    @media (max-width: 720px) { .columns { grid-template-columns: 1fr; gap: 0; } main { padding: 24px 16px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">SUPPORT AGENT / 本地演示</div>
    <h1>查询工单，查找技术资料</h1>
    <p class="muted">只读助手 · 工单为虚构数据 · 技术资料来自本地 FastAPI 文档</p>
  </header>
  <form id="form" class="card">
    <label for="question">你需要什么帮助？</label>
    <textarea id="question" placeholder="例如：先查询 T1001，再根据工单标题检索相关资料。" required></textarea>
    <div class="examples">
      <button type="button" class="example" data-question="查询T1001的状态，只查工单，不需要检索资料。">查询 T1001</button>
      <button type="button" class="example" data-question="列出所有待处理的工单。">待处理工单</button>
      <button type="button" class="example" data-question="先查询T1001，再根据工单标题检索相关FastAPI资料。">工单与资料</button>
    </div>
    <div class="actions"><button id="submit" type="submit">提交问题</button><a href="/docs">接口文档</a><span id="status" role="status" aria-live="polite">等待输入</span></div>
    <p class="muted">点击示例只填入问题。提交会调用模型 API；检索资料需要先启动本地 RAG 服务。每次提交是独立任务。</p>
  </form>
  <section id="output" hidden>
    <div class="columns">
      <section class="card"><h2>回答</h2><div id="answer" class="answer"></div></section>
      <section class="card"><h2>实际工具记录 <span id="count"></span></h2><p class="muted">由程序记录，任务返回后展示，不是模型生成的步骤说明。</p><div id="tools"></div></section>
    </div>
    <section class="card"><h2>检索返回的候选资料</h2><p class="muted">候选资料不等于每条都被回答引用，也不自动证明回答正确。</p><div id="sources"></div></section>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const examples = document.querySelectorAll('.example');
  examples.forEach(button => button.addEventListener('click', () => {
    $('question').value = button.dataset.question;
    $('question').focus();
  }));
  // 外部文本始终用 textContent 展示，避免把模型或资料内容当成 HTML 执行。
  function add(parent, tag, text, className = '') {
    const element = document.createElement(tag);
    element.textContent = text;
    element.className = className;
    parent.appendChild(element);
    return element;
  }
  function render(data) {
    $('output').hidden = false;
    $('answer').textContent = data.ok ? String(data.data ?? '') : String(data.error ?? '执行未完成');
    $('answer').classList.toggle('error', !data.ok);
    const history = Array.isArray(data.tool_calls) ? data.tool_calls : [];
    $('count').textContent = `（${history.length}）`;
    $('tools').replaceChildren();
    $('sources').replaceChildren();
    if (!history.length) add($('tools'), 'p', '本次没有已返回结果的工具记录。', 'muted');
    const seen = new Set();
    history.forEach(call => {
      const details = add($('tools'), 'details', '');
      const success = call.result?.ok === true;
      add(details, 'summary', `第 ${call.round} 轮 · ${call.name} · ${success ? '成功' : '失败'}`);
      add(details, 'p', '调用参数');
      add(details, 'pre', call.arguments_json ?? '');
      add(details, 'p', '工具返回结果');
      add(details, 'pre', JSON.stringify(call.result, null, 2));
      const results = call.name === 'search_docs' && success ? call.result?.data?.results : [];
      if (!Array.isArray(results)) return;
      results.forEach(item => {
        const key = JSON.stringify([item.source, item.chunk_id]);
        if (seen.has(key)) return;
        seen.add(key);
        const section = add($('sources'), 'div', '', 'source');
        add(section, 'strong', `${item.source} · 片段 ${item.chunk_id}`);
        add(section, 'div', item.chunk ?? '', 'answer');
      });
    });
    if (!seen.size) add($('sources'), 'p', '本次工具记录中没有返回资料片段。', 'muted');
  }
  $('form').addEventListener('submit', async event => {
    event.preventDefault();
    const question = $('question').value.trim();
    if (!question) { $('status').textContent = '请输入非空问题'; $('question').focus(); return; }
    $('output').hidden = true;
    $('submit').disabled = true;
    $('question').disabled = true;
    examples.forEach(button => button.disabled = true);
    $('status').textContent = '正在处理，请等待任务返回…';
    try {
      const response = await fetch('/ask', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question}),
      });
      let data;
      try { data = await response.json(); }
      catch { throw new Error(`服务返回了无法解析的响应（HTTP ${response.status}）`); }
      if (!response.ok) throw new Error(`HTTP ${response.status}：${JSON.stringify(data.detail ?? data)}`);
      if (!data || typeof data.ok !== 'boolean') throw new Error('服务响应缺少有效的 ok 字段');
      render(data);
      $('status').textContent = data.ok ? '任务已返回回答' : '任务未完成，请查看错误与工具记录';
    } catch (error) {
      render({ok: false, error: error.message, tool_calls: []});
      $('status').textContent = '请求失败；未收到完整任务记录，不代表服务端没有执行。';
    } finally {
      $('submit').disabled = false;
      $('question').disabled = false;
      examples.forEach(button => button.disabled = false);
    }
  });
</script>
</body>
</html>
